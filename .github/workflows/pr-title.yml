# Kiểm tra tiêu đề PR theo dạng `<loại>: <mô tả>`.
# Squash merge lấy tiêu đề PR làm commit message. Xem docs/design/ci-cd.md.
name: PR title

on:
  # Chỉ đọc tiêu đề, không checkout code của PR, nên an toàn với pull_request_target.
  pull_request_target:
    types: [opened, reopened, edited, synchronize]

permissions:
  pull-requests: read

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            test
            chore
